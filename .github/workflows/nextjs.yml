name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 30m
          script: |
            echo "📁 Moving to project folder"
            cd Planbook-FE || exit 1

            echo "🔄 Resetting and pulling latest code"
            git reset --hard
            git pull origin master || git pull origin main

            echo "🧹 Cleaning up old Docker resources..."
            docker system prune -f --volumes || true
            docker image prune -a -f || true

            echo "💾 Checking disk space..."
            df -h

            echo "🏗️ Building Docker image with extended timeout..."
            # Tăng timeout cho Docker build và sử dụng build args để tối ưu
            if ! timeout 2400 docker compose -f docker-compose.yml build --no-cache; then
              echo "❌ Build failed or timed out after 40 minutes. Container still running. Abort."
              exit 1
            fi

            echo "🧼 Build succeeded. Stopping old container..."
            docker stop planbook-app || true
            docker rm planbook-app || true

            echo "🚀 Starting new container..."
            docker compose -f docker-compose.yml up -d

            echo "⏳ Checking container status..."
            docker ps -a

            echo "📋 Container logs (last 20 lines):"
            docker logs planbook-app --tail 20

            echo "🩺 Performing health check..."
            # Wait for container to be ready with shorter intervals
            for i in {1..12}; do
              echo "Health check attempt $i/12..."
              if curl -fs http://localhost:3000; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ Health check failed. Container logs:"
                docker logs planbook-app --tail 50
                echo "Container status:"
                docker ps -a
                exit 1
              fi
              echo "Waiting 10 seconds..."
              sleep 10
            done

            if true; then
              echo "✅ Deployment successful!"
              docker image prune -f
            else
              echo "❌ Health check failed. Rolling back..."
              docker stop planbook-app || true
              docker rm planbook-app || true
              exit 1
            fi
