name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Tăng timeout lên 60 phút

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60m # Tăng timeout SSH lên 60 phút
          command_timeout: 60m # Timeout cho từng command
          script_stop: true # Dừng khi có lỗi
          script: |
            echo "📁 Moving to project folder"
            cd Planbook-FE || exit 1

            echo "🔄 Resetting and pulling latest code"
            git reset --hard
            git pull origin master || git pull origin main

            echo "📦 Installing/updating dependencies..."
            npm install

            echo "🧹 Cleaning up old Docker resources (selective)..."
            # Chỉ xóa containers và images không sử dụng, giữ lại cache
            docker container prune -f || true
            docker image prune -f || true
            # Không xóa volumes và build cache để tăng tốc build

            echo "💾 Checking disk space..."
            df -h

            echo "🏗️ Building Docker image with optimized settings..."
            # Tăng timeout cho Docker daemon và tối ưu build
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Build với timeout dài hơn và progress output
            if ! timeout 3600 docker compose -f docker-compose.yml build --progress=plain; then
              echo "❌ Build failed or timed out after 60 minutes. Trying cleanup and rebuild..."
              docker system prune -f
              if ! timeout 2400 docker compose -f docker-compose.yml build --no-cache --progress=plain; then
                echo "❌ Build failed completely. Abort."
                exit 1
              fi
            fi

            echo "🧼 Build succeeded. Stopping old container..."
            docker stop planbook-app || true
            docker rm planbook-app || true

            echo "🚀 Starting new container..."
            docker compose -f docker-compose.yml up -d

            echo "⏳ Checking container status..."
            docker ps -a

            echo "📋 Container logs (last 20 lines):"
            docker logs planbook-app --tail 20

            echo "🩺 Performing health check..."
            # Wait for container to be ready with shorter intervals
            for i in {1..12}; do
              echo "Health check attempt $i/12..."
              if curl -fs http://localhost:3000; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq 12 ]; then
                echo "❌ Health check failed. Container logs:"
                docker logs planbook-app --tail 50
                echo "Container status:"
                docker ps -a
                exit 1
              fi
              echo "Waiting 10 seconds..."
              sleep 10
            done

            if true; then
              echo "✅ Deployment successful!"
              docker image prune -f
            else
              echo "❌ Health check failed. Rolling back..."
              docker stop planbook-app || true
              docker rm planbook-app || true
              exit 1
            fi
