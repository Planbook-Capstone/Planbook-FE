services:
  # Ứng dụng Next.js chính
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_API_SECONDARY_URL: ${NEXT_PUBLIC_API_SECONDARY_URL}
        NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL}
        NEXT_PUBLIC_REDIRECT_URL: ${NEXT_PUBLIC_REDIRECT_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: planbook-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Port 3000 của host map đến port 3000 của container
    volumes:
      - ./public:/app/public
    networks:
      - planbook-network
    env_file:
      - .env
  # Portainer - Quản lý Docker containers
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped
    networks:
      - planbook-network

  # Dozzle - Xem logs real-time
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - planbook-network

volumes:
  db-data:
  portainer_data:

networks:
  planbook-network:
    driver: bridge
